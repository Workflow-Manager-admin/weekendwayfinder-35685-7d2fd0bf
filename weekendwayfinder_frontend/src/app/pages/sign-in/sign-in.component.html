<div class="sign-in-page">
  <div class="backdrop"></div>
  <div class="sign-in-container">
    <h2>WeekendWayfinder</h2>
    <form (submit)="signIn(); $event.preventDefault()" novalidate>
      <div>
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="username"
          placeholder="Enter any valid email address"
          [ngClass]="{'invalid': getFieldError('email')}"
          (blur)="onBlur('email')"
        />
        <div class="error-message">
          {{ getFieldError('email') }}
        </div>
      </div>
      <div>
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Enter any password"
          [ngClass]="{'invalid': getFieldError('password')}"
          (blur)="onBlur('password')"
        />
        <div class="error-message">
          {{ getFieldError('password') }}
        </div>
        <div style="font-size:0.90rem; color:#888; margin-bottom:1rem;">
          <em>Any email and any password will sign you in (demo mode).</em>
        </div>
      </div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button
        type="submit"
        class="sign-in-btn"
        [disabled]="submitting"
      >
        {{ submitting ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
