<div class="sign-in-bg">
  <div class="sign-in-form-container">
    <h2>Sign In to WeekendWayfinder</h2>
    <form (ngSubmit)="signIn()" #form="ngForm" autocomplete="off">
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Username"
        required
        #usernameInput="ngModel"
      />
      <div class="error" *ngIf="submitted && usernameInput.invalid">Username is required.</div>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
        #passwordInput="ngModel"
      />
      <div class="error" *ngIf="submitted && passwordInput.invalid">Password is required.</div>
      <button [disabled]="form.invalid">Sign In</button>
    </form>
  </div>
</div>
